app = "highlander-react-redux-demo"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npm run migrate"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  CLIENT_ORIGIN = "https://highlander-react-redux-demo.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 75

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
